# Bazelify okLinux's kernel tree and propose the result as a pull request.
#
# The kernel is ChromeOS's chromeos-6.6, configured exactly as okLinux's
# build.sh configures it. makers-bazel-plugin (mode=kbuild) writes MODULE.bazel,
# BUILD.bazel and a Bazel action per Kbuild target into the tree; Bazel then
# builds //:kernel to prove the result works. The whole tree, build files
# included, is committed to kernel/ on a branch named after the kernel commit
# and plugin revision, and a pull request against main is opened for it. A
# branch that already exists means that pair was already proposed.

name: Bazelify kernel

on:
  schedule:
    - cron: "17 1 * * *" # daily, after okLinux's midnight kernel build
  pull_request:
    paths:
      - ".github/workflows/bazelify.yml"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: "makers-bazel-plugin ref to build"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_REF: ${{ inputs.plugin_ref || 'main' }}
  OKLINUX_REPO: sevki/okLinux
  KERNEL_URL: https://chromium.googlesource.com/chromiumos/third_party/kernel
  KERNEL_BRANCH: chromeos-6.6

jobs:
  bazelify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bazel-linux
        uses: actions/checkout@v4

      - name: Checkout okLinux
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OKLINUX_REPO }}
          path: okLinux

      - name: Clone the kernel
        id: kernel
        run: |
          # kernel/ is the tree the last pull request committed; the new tree
          # replaces it, and the pull request shows what changed.
          rm -rf kernel
          git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_URL" kernel
          sha=$(git -C kernel rev-parse HEAD)
          short=$(git -C kernel rev-parse --short HEAD)
          # kernelrelease needs a configured tree; the Makefile's version does not.
          release=$(awk '/^(VERSION|PATCHLEVEL|SUBLEVEL) =/ {v[$1]=$3} END {print v["VERSION"] "." v["PATCHLEVEL"] "." v["SUBLEVEL"]}' kernel/Makefile)
          {
            echo "sha=$sha"
            echo "short=$short"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc kmod cpio flex bison \
            libncurses5-dev libelf-dev libssl-dev dwarves

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Restore tools
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/cargo-component
            ~/makers
          key: tools-${{ runner.os }}-${{ hashFiles('.github/workflows/bazelify.yml') }}

      - name: Install cargo-component and makers
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-component --locked
          cargo install --git https://github.com/sevki/makers make-sys \
            --features wasmtime --bin make --locked --root "$HOME/makers"

      # Saved here rather than when the job ends: a job that fails later would
      # otherwise throw the install away, and it takes minutes.
      - name: Save tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/cargo-component
            ~/makers
          key: tools-${{ runner.os }}-${{ hashFiles('.github/workflows/bazelify.yml') }}

      - name: Build the plugin
        run: |
          git clone --depth 1 -b "$PLUGIN_REF" https://github.com/sevki/makers-bazel-plugin plugin
          (cd plugin && cargo component build --release --features kbuild)
          echo "PLUGIN_SHA=$(git -C plugin rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Bazelify the kernel
        run: |
          MAKERS_MAKE="$HOME/makers/bin/make" scripts/bazelify.sh \
            kernel okLinux plugin/target/wasm32-wasip1/release/makers_bazel_plugin.wasm

      - name: Build //:kernel with Bazel
        working-directory: kernel
        env:
          USE_BAZEL_VERSION: 9.3.0
        run: |
          bazel build //:kernel --action_env=PATH
          file bazel-bin/arch/x86/boot/bzImage

      - name: Push a branch and open a pull request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short=${{ steps.kernel.outputs.short }}
          release=${{ steps.kernel.outputs.release }}
          branch="bazelify/${release}-${short}-${PLUGIN_SHA}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; this kernel and plugin were already proposed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 1048576000
          # The tree as the Bazel build saw it: configured and prepared (the
          # generated headers and host tools are inputs), without the checkout's
          # history or Bazel's output symlinks.
          rm -rf kernel/.git
          rm -f kernel/bazel-*
          echo 9.3.0 > kernel/.bazelversion
          echo 'build --action_env=PATH' > kernel/.bazelrc
          git fetch --depth 1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # -f: the kernel's own .gitignore files hide .config and the
          # generated files, and the build needs them.
          git add -f -A kernel
          git commit -q -m "kernel: okLinux's chromeos-6.6 ${release} (${short}) with Bazel build files"
          git push origin "$branch"
          body="The okLinux kernel tree with its Bazel build files, under \`kernel/\`.

          - kernel: [\`${short}\`](${KERNEL_URL}/+/${{ steps.kernel.outputs.sha }}) on \`${KERNEL_BRANCH}\`, configured as ${OKLINUX_REPO} build.sh configures it
          - build files (\`BUILD.bazel\`, \`MODULE.bazel\`, \`kbuild/\`): makers-bazel-plugin \`${PLUGIN_SHA}\`, mode=kbuild
          - verified: \`bazel build //:kernel\` succeeded on this tree (\`vmlinux\`, \`arch/x86/boot/bzImage\`)

          To build: \`cd kernel && bazel build //:kernel\`."
          gh pr create --base main --head "$branch" \
            --title "kernel ${release} (${short}) with Bazel build files" \
            --body "$body"
