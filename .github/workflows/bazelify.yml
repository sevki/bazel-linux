# Generate the Bazel files for okLinux's kernel and propose them as a PR.
#
# The kernel is ChromeOS's chromeos-6.6, configured exactly as okLinux's
# build.sh configures it. makers-bazel-plugin (mode=kbuild) writes MODULE.bazel,
# BUILD.bazel and a Bazel action per Kbuild target into the tree; Bazel then
# builds //:kernel to prove the result works. Only the generated files are
# committed (to oklinux/), on the branch bazelify/chromeos-6.6, with a pull
# request against main that the job opens or updates.

name: Bazelify kernel

on:
  schedule:
    - cron: "17 1 * * *" # daily, after okLinux's midnight kernel build
  pull_request:
    paths:
      - ".github/workflows/bazelify.yml"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: "makers-bazel-plugin ref to build"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_REF: ${{ inputs.plugin_ref || 'main' }}
  OKLINUX_REPO: sevki/okLinux
  KERNEL_URL: https://chromium.googlesource.com/chromiumos/third_party/kernel
  KERNEL_BRANCH: chromeos-6.6
  PR_BRANCH: bazelify/chromeos-6.6

jobs:
  bazelify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bazel-linux
        uses: actions/checkout@v4

      - name: Checkout okLinux
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OKLINUX_REPO }}
          path: okLinux

      - name: Clone the kernel
        id: kernel
        run: |
          git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_URL" kernel
          sha=$(git -C kernel rev-parse HEAD)
          short=$(git -C kernel rev-parse --short HEAD)
          release=$(make -C kernel -s kernelrelease 2>/dev/null || echo unknown)
          {
            echo "sha=$sha"
            echo "short=$short"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc kmod cpio flex bison \
            libncurses5-dev libelf-dev libssl-dev dwarves

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Restore tools
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/cargo-component
            ~/makers
          key: tools-${{ runner.os }}-${{ hashFiles('.github/workflows/bazelify.yml') }}

      - name: Install cargo-component and makers
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-component --locked
          cargo install --git https://github.com/sevki/makers make-sys \
            --features wasmtime --bin make --locked --root "$HOME/makers"

      # Saved here rather than when the job ends: a job that fails later would
      # otherwise throw the install away, and it takes minutes.
      - name: Save tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/cargo-component
            ~/makers
          key: tools-${{ runner.os }}-${{ hashFiles('.github/workflows/bazelify.yml') }}

      - name: Build the plugin
        run: |
          git clone --depth 1 -b "$PLUGIN_REF" https://github.com/sevki/makers-bazel-plugin plugin
          (cd plugin && cargo component build --release --features kbuild)
          echo "PLUGIN_SHA=$(git -C plugin rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Bazelify the kernel
        run: |
          MAKERS_MAKE="$HOME/makers/bin/make" scripts/bazelify.sh \
            kernel okLinux plugin/target/wasm32-wasip1/release/makers_bazel_plugin.wasm

      - name: Build //:kernel with Bazel
        working-directory: kernel
        env:
          USE_BAZEL_VERSION: 9.3.0
        run: |
          bazel build //:kernel --action_env=PATH
          file bazel-bin/arch/x86/boot/bzImage

      - name: Collect the generated files
        run: |
          out=generated/oklinux
          mkdir -p "$out"
          cp -r kernel/BUILD.bazel kernel/MODULE.bazel kernel/kbuild "$out/"
          echo 9.3.0 > "$out/.bazelversion"
          echo 'build --action_env=PATH' > "$out/.bazelrc"
          cat > "$out/KERNEL" <<EOF
          kernel: ${KERNEL_URL}/+/${{ steps.kernel.outputs.sha }} (${KERNEL_BRANCH}, ${{ steps.kernel.outputs.release }})
          config: ${OKLINUX_REPO} build.sh
          plugin: makers-bazel-plugin ${PLUGIN_SHA} (mode=kbuild)
          EOF
          sed -i 's/^ *//' "$out/KERNEL"

      - name: Upload the generated files (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bazel-files
          path: generated/oklinux
          retention-days: 3

      - name: Push a branch and open a pull request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin main
          git checkout -B "$PR_BRANCH" FETCH_HEAD
          rm -rf oklinux
          mv generated/oklinux oklinux
          git add -A oklinux
          if git diff --cached --quiet; then
            echo "oklinux/ is already up to date on main; nothing to propose."
            exit 0
          fi
          short=${{ steps.kernel.outputs.short }}
          git commit -q -m "oklinux: Bazel files for kernel ${{ steps.kernel.outputs.release }} (${short})"
          git push --force origin "$PR_BRANCH"
          body="Bazel files for the okLinux kernel, generated by makers-bazel-plugin \`${PLUGIN_SHA}\` (mode=kbuild).

          - kernel: [\`${short}\`](${KERNEL_URL}/+/${{ steps.kernel.outputs.sha }}) on \`${KERNEL_BRANCH}\`
          - config: ${OKLINUX_REPO} build.sh
          - verified: \`bazel build //:kernel\` succeeded on this tree

          To use them, copy \`oklinux/\` over a checkout of that kernel commit and run \`bazel build //:kernel\` (\`vmlinux\` and \`arch/x86/boot/bzImage\`).

          This branch is regenerated nightly; merge to record the current files on main."
          n=$(gh pr list --head "$PR_BRANCH" --base main --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh pr edit "$n" --body "$body"
          else
            gh pr create --base main --head "$PR_BRANCH" \
              --title "oklinux: Bazel files for kernel ${{ steps.kernel.outputs.release }} (${short})" \
              --body "$body"
          fi
